  <h3 style="margin-top:0">v1.7.75 · 一键更新当前 API 预设</h3>
  <p>设置 → 配置预设新增「更新」按钮。先选中已有预设，修改地址、密钥或模型后点更新，即覆盖这个预设的保存设置，保留原名称，不必重新命名保存。</p>
  <p>更新同时保存当前生效配置，切换预设后再回来、刷新页面仍使用更新后的设置。副 API 的独立配置不会跟着改变。「保存」仍用于另存预设，「删除」仍删除所选预设。</p>
  <p>完整记忆、空间、钱包与聊天资料保持不变。v1.7.74 的完整请求统计和无关联系人资料精简继续保留。</p>
